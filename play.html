<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murmur</title>
    <link rel="stylesheet" href="murmur-tokens.css" />
    <link rel="stylesheet" href="murmur-play.css" />
  </head>
  <body>
    <a href="index.html" class="back-link" aria-label="Back to gallery">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>

    <canvas id="canvas" width="5000" height="5000"></canvas>

    <div class="controls" id="controls">
      <button id="play-pause" aria-label="Play"></button>
      <button id="step" aria-label="Step forward">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="4,3 16,12 4,21" fill="currentColor" stroke="none"/><rect x="18" y="4" width="2.5" height="16" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="reset" aria-label="Reset">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><polyline points="3 22 3 16 9 16"/></svg>
      </button>
      <div class="controls-divider"></div>
      <button id="info-toggle" aria-label="Info">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      </button>
    </div>

    <div class="title-overlay" id="title-overlay"></div>
    <span class="iteration-display" id="iterations">0</span>
    <span class="settled-badge" id="settled-badge">Settled</span>

    <div class="info-panel" id="info-panel">
      <div class="info-panel-header">
        <span class="info-panel-title" id="panel-title"></span>
        <button class="info-panel-close" id="panel-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <p class="info-panel-description" id="panel-description"></p>
      <fieldset id="colors"></fieldset>
    </div>

    <script type="module">
      import { initSimulation } from "./initSimulation.js";
      import { PlayControls } from "./ui/PlayControls.js";
      import { AutoHide } from "./ui/AutoHide.js";
      import { PalettePanel } from "./ui/PalettePanel.js";
      import { InitPresetPanel } from "./ui/InitPresetPanel.js";

      const params = new URLSearchParams(window.location.search);
      const scenarioId = params.get("scenario");
      const ruleId = params.get("rule");

      if (!scenarioId && !ruleId) {
        window.location.href = "index.html";
      }

      // --- Play controls ---
      const playControls = new PlayControls({
        playPauseBtn: document.getElementById("play-pause"),
        stepBtn: document.getElementById("step"),
        resetBtn: document.getElementById("reset"),
      });

      // --- Init simulation ---
      const sim = await initSimulation({
        scenarioId: scenarioId || ruleId,
        playControls,
        elements: {
          canvas: document.getElementById("canvas"),
          iterationsEl: document.getElementById("iterations"),
          colorsEl: document.getElementById("colors"),
          titleEl: document.getElementById("title-overlay"),
          descEl: document.getElementById("panel-description"),
          settledBadgeEl: document.getElementById("settled-badge"),
        },
      });

      // Set panel title
      document.getElementById("panel-title").textContent =
        sim.scenario.label || sim.scenario.id;

      // Update page title
      document.title = `${sim.scenario.label || sim.scenario.id} — Murmur`;

      // --- Palette panel ---
      const palettePanel = new PalettePanel({
        panelEl: document.getElementById("info-panel"),
        colorOverride: sim.colorOverride,
        rule: sim.rule,
        scenario: sim.scenario,
        onColorChange: () => {
          sim.drawingEngine.invalidate();
          sim.drawingEngine.draw(sim.automaton.state);
        },
      });
      palettePanel.render();

      // --- Init preset panel (starting pattern selector) ---
      const initPresetPanel = new InitPresetPanel({
        panelEl: document.getElementById("info-panel"),
        rule: sim.rule,
        controller: sim.controller,
        playControls,
        settledBadgeEl: document.getElementById("settled-badge"),
      });
      initPresetPanel.render();

      // --- Kaleidoscope mode: hide play button ---
      if (sim.scenario.mode === "kaleidoscope") {
        document.getElementById("play-pause").style.display = "none";
      }

      // --- Auto-hide controls + title ---
      const controls = document.getElementById("controls");
      const titleOverlay = document.getElementById("title-overlay");
      new AutoHide([controls, titleOverlay]);

      // --- Info panel toggle ---
      const infoPanel = document.getElementById("info-panel");
      const infoToggle = document.getElementById("info-toggle");
      const panelClose = document.getElementById("panel-close");

      infoToggle.addEventListener("click", () => {
        infoPanel.classList.toggle("open");
      });

      panelClose.addEventListener("click", () => {
        infoPanel.classList.remove("open");
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          infoPanel.classList.remove("open");
        }
      });
    </script>
  </body>
</html>

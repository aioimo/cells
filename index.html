<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murmur</title>
    <link rel="stylesheet" href="murmur-tokens.css" />
    <link rel="stylesheet" href="murmur-gallery.css" />
  </head>
  <body>
    <main class="gallery">
      <header class="gallery-header">
        <h1>murmur</h1>
        <p class="gallery-subtitle">
          Patterns born from simple rules.
        </p>
      </header>
      <div id="admin-bar" class="admin-bar" hidden>
        <strong>Admin</strong>
        <span id="admin-count"></span>
      </div>
      <a id="hero" class="hero" hidden></a>
      <div id="grid" class="grid"></div>
    </main>

    <script type="module">
      import {
        SCENARIOS,
        getCuratedScenarios,
        isAdminMode,
        HERO_SCENARIO_ID,
        getScenarioById,
      } from "./scenarios.js";

      const admin = isAdminMode();
      const heroScenario = getScenarioById(HERO_SCENARIO_ID);
      const scenarios = admin
        ? SCENARIOS.slice().sort((a, b) => {
            if (a.curated && !b.curated) return -1;
            if (!a.curated && b.curated) return 1;
            return (a.sortOrder ?? 999) - (b.sortOrder ?? 999);
          })
        : getCuratedScenarios();

      // --- Admin bar ---
      if (admin) {
        const bar = document.getElementById("admin-bar");
        bar.hidden = false;
        const curated = SCENARIOS.filter((s) => s.curated).length;
        document.getElementById("admin-count").textContent =
          `${curated} of ${SCENARIOS.length} curated`;
      }

      // --- Hero ---
      const heroEl = document.getElementById("hero");
      heroEl.hidden = false;
      heroEl.href = `play.html?scenario=${encodeURIComponent(heroScenario.id)}`;

      const heroImg = document.createElement("img");
      heroImg.className = "hero-thumbnail";
      heroImg.alt = heroScenario.label;
      heroImg.src = `thumbnails/${heroScenario.id}.png`;
      heroImg.onerror = function () { this.style.display = "none"; };
      heroEl.appendChild(heroImg);

      const heroName = document.createElement("span");
      heroName.className = "hero-name";
      heroName.textContent = heroScenario.label;
      heroEl.appendChild(heroName);

      // --- Grid ---
      const grid = document.getElementById("grid");

      scenarios.forEach((scenario) => {
        // Skip hero in grid
        if (scenario.id === HERO_SCENARIO_ID && !admin) return;

        const link = document.createElement("a");
        link.href = `play.html?scenario=${encodeURIComponent(scenario.id)}`;
        link.className = "card";
        if (admin && !scenario.curated) link.classList.add("not-curated");

        const imageWrap = document.createElement("div");
        imageWrap.className = "card-image-wrap";

        const img = document.createElement("img");
        img.className = "card-thumbnail";
        img.alt = scenario.label || scenario.id;
        img.loading = "lazy";
        img.src = `thumbnails/${scenario.id}.png`;
        img.onerror = function () { this.style.display = "none"; };

        imageWrap.appendChild(img);
        link.appendChild(imageWrap);

        const name = document.createElement("span");
        name.className = "card-name";
        name.textContent = scenario.label || scenario.id;
        link.appendChild(name);

        grid.appendChild(link);
      });
    </script>
  </body>
</html>
